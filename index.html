<style>
:root{--bg:#0b1230;--card:#111a40;--fg:#eef2ff;--muted:#9aa6d1;--line:#26315f;--accent:#5e8bff;--bad:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Onest",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.name{font:500 34px/1 "Unbounded","Onest",system-ui,sans-serif;letter-spacing:.01em}
.by{font-size:12px;color:var(--muted);font-style:italic;letter-spacing:.04em}
form{width:100%;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:var(--muted);text-align:left}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:12px 14px;border-radius:10px;border:0;background:var(--accent);color:#08102e;font:500 15px "Onest",system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:20px;font-size:13px;color:var(--bad)}
.lg-arc{stroke-dashoffset:120;animation:lgArc 4.5s ease-in-out infinite}
.lg-needle{transform-origin:32px 32px;transform-box:view-box;animation:lgNeedle 4.5s ease-in-out infinite}
@keyframes lgArc{0%{stroke-dashoffset:120}45%,85%{stroke-dashoffset:20}100%{stroke-dashoffset:120}}
@keyframes lgNeedle{0%{transform:rotate(-110deg)}45%,85%{transform:rotate(70deg)}100%{transform:rotate(-110deg)}}
@media (prefers-reduced-motion:reduce){.lg-arc{animation:none;stroke-dashoffset:20}.lg-needle{animation:none;transform:rotate(45deg)}}
</style>
</head>

    <div class="name">Пульт</div>
    <div class="by">by Bogdan Tregubov</div>

const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\s+/g,"");
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(login){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(login)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  for(const b of BLOBS){
    try{
      const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.i)},key,b64(b.c));
      const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      return html;
    }catch(e){}
  }
  return null;
}
async function enter(login,auto){
  const go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;go.textContent="Открываю…";err.textContent="";
  const html=await open(login);
  if(!html){go.disabled=false;go.textContent="Войти";if(!auto)err.textContent="Такого входа нет. Проверь, как написано слово.";try{localStorage.removeItem("pult-login")}catch(e){}return}
  try{localStorage.setItem("pult-login",login)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("login").value.trim();if(v)enter(v,false)});
document.getElementById("login").addEventListener("input",()=>{document.getElementById("err").textContent=""});
try{const saved=localStorage.getItem("pult-login");if(saved){document.getElementById("login").value=saved;enter(saved,true)}}catch(e){}
